<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>사고접수</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --p: #3182f6;
        --p-light: #e8f3ff;
        --p-dark: #1b64da;
        --bg: #f7f8fa;
        --surface: #fff;
        --field-bg: #f2f4f6;
        --white: #fff;
        --border: #e5e8eb;
        --text: #191f28;
        --text-sub: #8b95a1;
        --placeholder: #b0b8c1;
        --radius: 14px;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg);
        font-family:
          "SUIT Variable", SUIT, -apple-system, BlinkMacSystemFont,
          "Pretendard Variable", Pretendard, "Noto Sans KR", sans-serif;
        color: var(--text);
        padding-bottom: 80px;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.92);
        padding: 14px 18px;
        border-bottom: 1px solid rgba(229, 232, 235, 0.9);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header {
        max-width: 480px;
        margin: 0 auto;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.04em;
      }
      .header-badge {
        font-size: 11px;
        font-weight: 800;
        color: var(--p);
        background: var(--p-light);
        padding: 5px 10px;
        border-radius: 999px;
      }

      /* ── Sections ── */
      .form-body {
        padding: 8px 14px 20px;
      }
      .form-body {
        max-width: 480px;
        margin: 0 auto;
      }

      .section {
        margin-top: 14px;
      }
      .section:first-child {
        margin-top: 8px;
      }

      .section-label {
        font-size: 13px;
        font-weight: 800;
        color: #6b7684;
        letter-spacing: -0.03em;
        padding: 0 2px 7px;
      }

      .card {
        background: var(--surface);
        border-radius: 20px;
        padding: 18px;
        border: 1px solid rgba(229, 232, 235, 0.8);
        box-shadow: 0 8px 24px rgba(25, 31, 40, 0.04);
      }

      /* ── Fields ── */
      .field-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .half-row {
        display: flex;
        gap: 10px;
      }
      .half-row > .field {
        flex: 1;
        min-width: 0;
      }

      .field-label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #333d4b;
        letter-spacing: -0.03em;
        margin-bottom: 8px;
      }
      .field-label .req {
        color: #e53935;
        margin-left: 2px;
      }

      input[type="text"],
      input[type="tel"],
      input[type="datetime-local"],
      select {
        width: 100%;
        padding: 14px 15px;
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        font-size: 16px;
        font-family: inherit;
        color: var(--text);
        font-weight: 600;
        letter-spacing: -0.03em;
        background: var(--field-bg);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }
      input:focus,
      select:focus {
        border-color: rgba(49, 130, 246, 0.45);
        box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.12);
        background: var(--white);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--placeholder);
      }

      textarea {
        width: 100%;
        padding: 14px 15px;
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        font-size: 16px;
        font-family: inherit;
        color: var(--text);
        font-weight: 600;
        letter-spacing: -0.03em;
        background: var(--field-bg);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        resize: vertical;
        min-height: 80px;
      }
      textarea:focus {
        border-color: rgba(49, 130, 246, 0.45);
        box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.12);
        background: var(--white);
      }

      .select-wrap {
        position: relative;
      }
      .select-trigger {
        width: 100%;
        padding: 14px 44px 14px 15px;
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        background: var(--field-bg);
        color: var(--text);
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.35;
        text-align: left;
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      }

      .select-trigger.placeholder {
        color: var(--text);
      }

      .select-wrap.open .select-trigger,
      .select-trigger:focus {
        border-color: rgba(49, 130, 246, 0.45);
        box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.12);
        background: var(--white);
      }

      .select-options {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 200;
        max-height: 240px;
        overflow-y: auto;
        padding: 6px;
        border: 1px solid rgba(229, 232, 235, 0.95);
        border-radius: 18px;
        background: var(--white);
        box-shadow: 0 16px 40px rgba(25, 31, 40, 0.16);
        list-style: none;
      }

      .select-wrap.open .select-options {
        display: block;
      }

      .select-wrap.drop-up .select-options {
        top: auto;
        bottom: calc(100% + 8px);
      }

      .select-option {
        padding: 12px 13px;
        border-radius: 12px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.03em;
        cursor: pointer;
      }

      .select-option:hover,
      .select-option.selected {
        background: var(--p-light);
        color: var(--p);
      }
      .select-wrap::after {
        content: "";
        position: absolute;
        right: 17px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-right: 2px solid #8b95a1;
        border-bottom: 2px solid #8b95a1;
        transform: translateY(-65%) rotate(45deg);
        pointer-events: none;
      }

      /* ── Radio chips ── */
      .radio-row {
        display: flex;
        gap: 8px;
      }
      .chip {
        flex: 1;
        padding: 12px 0;
        border-radius: var(--radius);
        border: 1.5px solid var(--border);
        background: #fafbfc;
        color: var(--text-sub);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .chip.on {
        border-color: var(--p);
        background: var(--p-light);
        color: var(--p);
        font-weight: 800;
      }

      /* ── Bottom bar ── */
      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        padding: 10px 14px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        background: var(--white);
        border-top: 1px solid var(--border);
        z-index: 100;
      }
      .submit-btn {
        width: 100%;
        padding: 14px 0;
        border-radius: var(--radius);
        border: none;
        background: #3182f6;
        color: var(--white);
        font-size: 16px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s, background 0.2s, box-shadow 0.2s;
      }
      .submit-btn:disabled {
        opacity: 1;
        cursor: default;
        color: rgba(255, 255, 255, 0.72);
        background: #d1d6db;
        box-shadow: none;
      }
      .submit-btn:not(:disabled):hover {
        transform: translateY(-1px);
      }
      .submit-btn:not(:disabled):active {
        transform: translateY(0);
        background: var(--p-dark);
      }

      /* ── Success ── */
      .success {
        padding: 100px 24px;
        text-align: center;
        display: none;
      }
      .success.show {
        display: block;
      }
      .success .check {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--p);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .success h2 {
        margin: 20px 0 4px;
        font-size: 19px;
        font-weight: 800;
      }
      .success p {
        font-size: 14px;
        color: #999;
      }
      .reset-btn {
        margin-top: 28px;
        padding: 14px 40px;
        border-radius: var(--radius);
        border: none;
        background: var(--p);
        color: var(--white);
        font-size: 15px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
      }

      .form-wrap.hide {
        display: none;
      }

      @media (max-width: 360px) {
        .half-row {
          flex-direction: column;
        }
      }

      @media (min-width: 768px) {
        body {
          padding-bottom: 0;
          background:
            radial-gradient(circle at 50% -140px, rgba(49, 130, 246, 0.14) 0, transparent 360px),
            var(--bg);
        }

        .header {
          position: static;
          max-width: 960px;
          margin: 24px auto 0;
          padding: 18px 24px;
          border-radius: 24px;
          border: 1px solid rgba(229, 232, 235, 0.9);
          box-shadow: 0 14px 32px rgba(25, 31, 40, 0.07);
        }

        .header h1 {
          font-size: 20px;
        }

        .header-badge {
          font-size: 13px;
          padding: 5px 12px;
        }

        .form-body {
          max-width: 960px;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
          padding: 22px 20px 0;
        }

        .section {
          margin-top: 0;
        }

        .section:first-child,
        .section:last-child {
          grid-column: 1 / -1;
        }

        .section:first-child {
          padding: 4px 0 8px !important;
        }

        .section:first-child img {
          height: 56px !important;
        }

        .section-label {
          padding: 0 2px 6px;
          font-size: 13px;
        }

        .card {
          padding: 19px;
          border-radius: 24px;
          border-color: rgba(229, 232, 235, 0.9);
          box-shadow: 0 10px 28px rgba(25, 31, 40, 0.055);
        }

        .field-list {
          gap: 14px;
        }

        .half-row {
          gap: 12px;
        }

        .field-label {
          font-size: 15px;
          font-weight: 700;
          margin-bottom: 8px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="datetime-local"],
        select,
        textarea {
          padding: 15px 16px;
          border-radius: 16px;
          font-size: 17px;
          background: var(--field-bg);
        }

        .select-trigger {
          padding: 15px 48px 15px 16px;
          border-radius: 16px;
          font-size: 17px;
          background: var(--field-bg);
        }


        .bottom-bar {
          position: static;
          transform: none;
          max-width: 960px;
          margin: 14px auto 34px;
          padding: 0 20px;
          border-top: none;
          background: transparent;
        }

        .submit-btn {
          padding: 17px 0;
          border-radius: 18px;
          font-size: 17px;
          box-shadow: 0 12px 24px rgba(49, 130, 246, 0.22);
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <h1>사고접수</h1>
      <span class="header-badge" id="badge">필수 0/6</span>
    </div>

    <!-- Form -->
    <div class="form-wrap" id="formWrap">
      <div class="form-body">
        <!-- 로고 -->
        <div class="section" style="text-align: center; padding: 12px 0 4px">
          <img src="image/olympos.png" alt="OLYMPOS" style="height: 64px" />
        </div>

        <!-- 고객 정보 -->
        <div class="section">
          <div class="section-label">고객 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label">1. 고객명<span class="req">*</span></label>
                <input type="text" data-key="customerName" data-required placeholder="홍길동" autocomplete="name" />
              </div>
              <div class="field">
                <label class="field-label">2. 고객 연락처<span class="req">*</span></label>
                <input type="tel" data-key="customerPhone" data-required placeholder="010-1234-5678" inputmode="numeric" autocomplete="tel" maxlength="13" />
              </div>
            </div>
          </div>
        </div>

        <!-- 차량 정보 -->
        <div class="section">
          <div class="section-label">고객 차량 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="half-row">
                <div class="field">
                  <label class="field-label">3-1. 국산/외산<span class="req">*</span></label>
                  <div class="select-wrap" data-select data-key="carOrigin" data-required>
                    <button class="select-trigger placeholder" type="button" aria-haspopup="listbox" aria-expanded="false">선택</button>
                    <ul class="select-options" role="listbox">
                      <li class="select-option" data-value="국산" role="option">국산</li>
                      <li class="select-option" data-value="외산" role="option">외산</li>
                    </ul>
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">3-2. 차종명<span class="req">*</span></label>
                  <input type="text" data-key="carModel" data-required placeholder="그랜저" />
                </div>
              </div>
              <div class="field">
                <label class="field-label">4. 고객 차량 번호<span class="req">*</span></label>
                <input type="text" data-key="carNo" data-required placeholder="12가3456" />
              </div>
            </div>
          </div>
        </div>

        <!-- 대차 정보 -->
        <div class="section">
          <div class="section-label">대차 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label">5. 대차지역<span class="req">*</span></label>
                <div class="select-wrap" data-select data-key="rentalRegion" data-required>
                  <button class="select-trigger placeholder" type="button" aria-haspopup="listbox" aria-expanded="false">시/도 선택</button>
                  <ul class="select-options" role="listbox">
                    <li class="select-option" data-value="서울특별시" role="option">서울특별시</li>
                    <li class="select-option" data-value="부산광역시" role="option">부산광역시</li>
                    <li class="select-option" data-value="대구광역시" role="option">대구광역시</li>
                    <li class="select-option" data-value="인천광역시" role="option">인천광역시</li>
                    <li class="select-option" data-value="광주광역시" role="option">광주광역시</li>
                    <li class="select-option" data-value="대전광역시" role="option">대전광역시</li>
                    <li class="select-option" data-value="울산광역시" role="option">울산광역시</li>
                    <li class="select-option" data-value="세종특별자치시" role="option">세종특별자치시</li>
                    <li class="select-option" data-value="경기도" role="option">경기도</li>
                    <li class="select-option" data-value="강원특별자치도" role="option">강원특별자치도</li>
                    <li class="select-option" data-value="충청북도" role="option">충청북도</li>
                    <li class="select-option" data-value="충청남도" role="option">충청남도</li>
                    <li class="select-option" data-value="전북특별자치도" role="option">전북특별자치도</li>
                    <li class="select-option" data-value="전라남도" role="option">전라남도</li>
                    <li class="select-option" data-value="경상북도" role="option">경상북도</li>
                    <li class="select-option" data-value="경상남도" role="option">경상남도</li>
                    <li class="select-option" data-value="제주특별자치도" role="option">제주특별자치도</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom-bar" id="bottomBar">
      <button class="submit-btn" id="submitBtn" disabled>접수하기</button>
    </div>

    <!-- Success -->
    <div class="success" id="successView">
      <div class="check">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h2>접수 완료</h2>
      <p id="successNo"></p>
      <button class="reset-btn" id="resetBtn">새 접수</button>
    </div>

    <script>
      const formData = {};
      const badge = document.getElementById("badge");
      const submitBtn = document.getElementById("submitBtn");
      const formWrap = document.getElementById("formWrap");
      const bottomBar = document.getElementById("bottomBar");
      const successView = document.getElementById("successView");
      const successNo = document.getElementById("successNo");
      const resetBtn = document.getElementById("resetBtn");
      const GOOGLE_APPS_SCRIPT_URL = "";

      // Input / Select / Textarea listeners
      document
        .querySelectorAll("input[data-key], select[data-key], textarea[data-key]")
        .forEach((el) => {
          const syncValue = () => {
            if (el.dataset.key === "customerPhone") {
              el.value = formatPhoneNumber(el.value);
            }

            formData[el.dataset.key] = el.value.trim();
            updateBadge();
          };

          el.addEventListener("input", syncValue);
          el.addEventListener("change", syncValue);
        });

      // Custom select listeners
      document.querySelectorAll("[data-select]").forEach((wrap) => {
        const key = wrap.dataset.key;
        const trigger = wrap.querySelector(".select-trigger");
        const options = wrap.querySelectorAll(".select-option");

        trigger.addEventListener("click", () => {
          const isOpen = wrap.classList.toggle("open");
          trigger.setAttribute("aria-expanded", String(isOpen));
          document.querySelectorAll("[data-select]").forEach((other) => {
            if (other !== wrap) {
              other.classList.remove("open", "drop-up");
              other.querySelector(".select-trigger").setAttribute("aria-expanded", "false");
            }
          });

          if (isOpen) {
            wrap.classList.remove("drop-up");
            const optionsRect = wrap.querySelector(".select-options").getBoundingClientRect();
            const safeBottom = window.innerHeight - 96;
            if (optionsRect.bottom > safeBottom) {
              wrap.classList.add("drop-up");
            }
          } else {
            wrap.classList.remove("drop-up");
          }
        });

        options.forEach((option) => {
          option.addEventListener("click", () => {
            const value = option.dataset.value;
            formData[key] = value;
            trigger.textContent = value;
            trigger.classList.remove("placeholder");
            options.forEach((item) => item.classList.remove("selected"));
            option.classList.add("selected");
            wrap.classList.remove("open", "drop-up");
            trigger.setAttribute("aria-expanded", "false");
            updateBadge();
          });
        });
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-select]")) return;
        document.querySelectorAll("[data-select].open").forEach((wrap) => {
          wrap.classList.remove("open", "drop-up");
          wrap.querySelector(".select-trigger").setAttribute("aria-expanded", "false");
        });
      });

      // Radio chip listeners
      document.querySelectorAll("[data-radio]").forEach((group) => {
        const key = group.dataset.radio;
        group.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            group
              .querySelectorAll(".chip")
              .forEach((c) => c.classList.remove("on"));
            chip.classList.add("on");
            formData[key] = chip.dataset.val;
            updateBadge();
          });
        });
      });

      function formatPhoneNumber(value) {
        const digits = value.replace(/\D/g, "").slice(0, 11);

        if (digits.length <= 3) return digits;
        if (digits.length <= 7) return `${digits.slice(0, 3)}-${digits.slice(3)}`;
        return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
      }
      function getRequiredKeys() {
        const keys = [];
        document.querySelectorAll("[data-required]").forEach((el) => {
          if (el.dataset.key) keys.push(el.dataset.key);
          if (el.dataset.radio) keys.push(el.dataset.radio);
        });
        return keys;
      }

      function updateBadge() {
        const req = getRequiredKeys();
        const filled = req.filter(
          (k) => formData[k] && formData[k].toString().trim(),
        ).length;
        badge.textContent = `필수 ${filled}/${req.length}`;
        submitBtn.disabled = filled < req.length;
      }

      // Submit
      submitBtn.addEventListener("click", async () => {
        if (!GOOGLE_APPS_SCRIPT_URL) {
          alert("Google Apps Script URL이 아직 설정되지 않았습니다.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "접수 중...";

        const payload = {
          submittedAt: new Date().toISOString(),
          customerName: formData.customerName || "",
          customerPhone: formData.customerPhone || "",
          carOrigin: formData.carOrigin || "",
          carModel: formData.carModel || "",
          carNo: formData.carNo || "",
          rentalRegion: formData.rentalRegion || "",
        };

        try {
          await fetch(GOOGLE_APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify(payload),
          });

          formWrap.classList.add("hide");
          bottomBar.style.display = "none";
          successView.classList.add("show");
          successNo.textContent = `${payload.customerName}님 접수가 완료되었습니다.`;
        } catch (error) {
          alert("접수 저장에 실패했습니다. 잠시 후 다시 시도해주세요.");
        } finally {
          submitBtn.textContent = "접수하기";
          updateBadge();
        }
      });

      // Reset
      resetBtn.addEventListener("click", () => {
        Object.keys(formData).forEach((k) => delete formData[k]);
        document
          .querySelectorAll("input[data-key], textarea[data-key]")
          .forEach((el) => (el.value = ""));
        document.querySelectorAll("[data-select]").forEach((wrap) => {
          const trigger = wrap.querySelector(".select-trigger");
          trigger.textContent = wrap.dataset.key === "rentalRegion" ? "시/도 선택" : "선택";
          trigger.classList.add("placeholder");
          trigger.setAttribute("aria-expanded", "false");
          wrap.classList.remove("open", "drop-up");
          wrap.querySelectorAll(".select-option").forEach((option) => option.classList.remove("selected"));
        });
        document
          .querySelectorAll(".chip.on")
          .forEach((el) => el.classList.remove("on"));
        formWrap.classList.remove("hide");
        bottomBar.style.display = "";
        successView.classList.remove("show");
        updateBadge();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      updateBadge();
    </script>
  </body>
</html>
