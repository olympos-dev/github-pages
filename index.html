<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>사고접수</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --p: #2261ad;
        --p-light: #eaf1fa;
        --p-dark: #1a4d8a;
        --bg: #f0f2f5;
        --white: #fff;
        --border: #e0e3e8;
        --text: #111827;
        --text-sub: #6b7280;
        --radius: 10px;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR",
          sans-serif;
        color: var(--text);
        padding-bottom: 80px;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--p);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 800;
        color: var(--white);
        letter-spacing: -0.3px;
      }
      .header-badge {
        font-size: 11px;
        font-weight: 700;
        color: var(--p);
        background: rgba(255, 255, 255, 0.9);
        padding: 3px 10px;
        border-radius: 12px;
      }

      /* ── Sections ── */
      .form-body {
        padding: 8px 14px 20px;
      }

      .section {
        margin-top: 14px;
      }
      .section:first-child {
        margin-top: 8px;
      }

      .section-label {
        font-size: 12px;
        font-weight: 800;
        color: var(--text-sub);
        letter-spacing: 0.5px;
        padding: 0 4px 6px;
      }

      .card {
        background: var(--white);
        border-radius: 12px;
        padding: 16px;
        border: 1px solid var(--border);
      }

      /* ── Fields ── */
      .field-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .half-row {
        display: flex;
        gap: 10px;
      }
      .half-row > .field {
        flex: 1;
        min-width: 0;
      }

      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #555;
        margin-bottom: 6px;
      }
      .field-label .req {
        color: #e53935;
        margin-left: 2px;
      }

      input[type="text"],
      input[type="tel"],
      input[type="datetime-local"],
      select {
        width: 100%;
        padding: 12px 13px;
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        font-size: 15px;
        font-family: inherit;
        color: var(--text);
        background: #fafbfc;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        transition: border-color 0.15s;
      }
      input:focus,
      select:focus {
        border-color: var(--p);
        background: var(--white);
      }
      input::placeholder {
        color: #bbb;
      }

      .select-wrap {
        position: relative;
      }
      .select-wrap svg {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }

      /* ── Radio chips ── */
      .radio-row {
        display: flex;
        gap: 8px;
      }
      .chip {
        flex: 1;
        padding: 12px 0;
        border-radius: var(--radius);
        border: 1.5px solid var(--border);
        background: #fafbfc;
        color: var(--text-sub);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .chip.on {
        border-color: var(--p);
        background: var(--p-light);
        color: var(--p);
        font-weight: 800;
      }

      /* ── Bottom bar ── */
      .bottom-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        padding: 10px 14px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        background: var(--white);
        border-top: 1px solid var(--border);
        z-index: 100;
      }
      .submit-btn {
        width: 100%;
        padding: 14px 0;
        border-radius: var(--radius);
        border: none;
        background: var(--p);
        color: var(--white);
        font-size: 15px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .submit-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .submit-btn:not(:disabled):active {
        background: var(--p-dark);
      }

      /* ── Success ── */
      .success {
        padding: 100px 24px;
        text-align: center;
        display: none;
      }
      .success.show {
        display: block;
      }
      .success .check {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--p);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .success h2 {
        margin: 20px 0 4px;
        font-size: 19px;
        font-weight: 800;
      }
      .success p {
        font-size: 14px;
        color: #999;
      }
      .reset-btn {
        margin-top: 28px;
        padding: 14px 40px;
        border-radius: var(--radius);
        border: none;
        background: var(--p);
        color: var(--white);
        font-size: 15px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
      }

      .form-wrap.hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <h1>사고접수</h1>
      <span class="header-badge" id="badge">필수 0/8</span>
    </div>

    <!-- Form -->
    <div class="form-wrap" id="formWrap">
      <div class="form-body">
        <!-- 접수 정보 -->
        <div class="section">
          <div class="section-label">접수 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label"
                  >인입 구분<span class="req">*</span></label
                >
                <div class="select-wrap">
                  <select data-key="inboundType" data-required>
                    <option value="">선택</option>
                    <option>전화</option>
                    <option>카카오톡</option>
                    <option>앱</option>
                    <option>웹</option>
                    <option>기타</option>
                  </select>
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#aaa"
                    stroke-width="2.5"
                    stroke-linecap="round"
                  >
                    <polyline points="6 9 12 15 18 9" />
                  </svg>
                </div>
              </div>
              <div class="field">
                <label class="field-label"
                  >인입 일시<span class="req">*</span></label
                >
                <input
                  type="datetime-local"
                  data-key="inboundDate"
                  data-required
                />
              </div>
              <div class="field">
                <label class="field-label"
                  >사고접수번호<span class="req">*</span></label
                >
                <input
                  type="text"
                  data-key="accidentNo"
                  data-required
                  placeholder="ACC-2026-0001"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- 고객 정보 -->
        <div class="section">
          <div class="section-label">고객 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label"
                  >고객명<span class="req">*</span></label
                >
                <input
                  type="text"
                  data-key="customerName"
                  data-required
                  placeholder="홍길동"
                />
              </div>
              <div class="field">
                <label class="field-label"
                  >고객 연락처<span class="req">*</span></label
                >
                <input
                  type="tel"
                  data-key="customerPhone"
                  data-required
                  placeholder="010-0000-0000"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- 이동 경로 -->
        <div class="section">
          <div class="section-label">이동 경로</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label"
                  >출발지<span class="req">*</span></label
                >
                <input
                  type="text"
                  data-key="departure"
                  data-required
                  placeholder="주소 또는 장소명"
                />
              </div>
              <div class="field">
                <label class="field-label"
                  >도착지<span class="req">*</span></label
                >
                <input
                  type="text"
                  data-key="destination"
                  data-required
                  placeholder="주소 또는 장소명"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- 피해 차량 -->
        <div class="section">
          <div class="section-label">피해 차량</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label"
                  >피해차량 번호<span class="req">*</span></label
                >
                <input
                  type="text"
                  data-key="victimCarNo"
                  data-required
                  placeholder="12가 3456"
                />
              </div>
              <div class="field">
                <label class="field-label"
                  >국산 / 수입산<span class="req">*</span></label
                >
                <div
                  class="radio-row"
                  data-radio="victimCarOrigin"
                  data-required
                >
                  <button class="chip" data-val="국산">국산</button>
                  <button class="chip" data-val="수입산">수입산</button>
                </div>
              </div>
              <div class="half-row">
                <div class="field">
                  <label class="field-label">차종</label>
                  <input
                    type="text"
                    data-key="victimCarModel"
                    placeholder="쏘나타"
                  />
                </div>
                <div class="field">
                  <label class="field-label">연식</label>
                  <input
                    type="text"
                    data-key="victimCarYear"
                    inputmode="numeric"
                    placeholder="2023"
                  />
                </div>
              </div>
              <div class="field">
                <label class="field-label">배기량</label>
                <input
                  type="text"
                  data-key="victimCarCC"
                  inputmode="numeric"
                  placeholder="2000cc"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- 배차 정보 -->
        <div class="section">
          <div class="section-label">배차 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label">배차 차량 번호</label>
                <input
                  type="text"
                  data-key="dispatchCarNo"
                  placeholder="12가 3456"
                />
              </div>
              <div class="field">
                <label class="field-label">고객 희망 배차 일시</label>
                <input type="datetime-local" data-key="dispatchDate" />
              </div>
            </div>
          </div>
        </div>

        <!-- 처리 정보 -->
        <div class="section">
          <div class="section-label">처리 정보</div>
          <div class="card">
            <div class="field-list">
              <div class="field">
                <label class="field-label">공업사 주소</label>
                <input
                  type="text"
                  data-key="shopAddress"
                  placeholder="공업사 주소"
                />
              </div>
              <div class="field">
                <label class="field-label">공업사 연락처</label>
                <input
                  type="tel"
                  data-key="shopPhone"
                  placeholder="02-000-0000"
                />
              </div>
              <div class="field">
                <label class="field-label">보험사 분류</label>
                <div class="select-wrap">
                  <select data-key="insuranceType">
                    <option value="">선택</option>
                    <option>삼성화재</option>
                    <option>현대해상</option>
                    <option>DB손해보험</option>
                    <option>KB손해보험</option>
                    <option>메리츠화재</option>
                    <option>한화손해보험</option>
                    <option>롯데손해보험</option>
                    <option>MG손해보험</option>
                    <option>흥국화재</option>
                    <option>기타</option>
                  </select>
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#aaa"
                    stroke-width="2.5"
                    stroke-linecap="round"
                  >
                    <polyline points="6 9 12 15 18 9" />
                  </svg>
                </div>
              </div>
              <div class="field">
                <label class="field-label"
                  >과실 유무<span class="req">*</span></label
                >
                <div class="radio-row" data-radio="faultYn" data-required>
                  <button class="chip" data-val="유">유</button>
                  <button class="chip" data-val="무">무</button>
                  <button class="chip" data-val="미정">미정</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom-bar" id="bottomBar">
      <button class="submit-btn" id="submitBtn" disabled>접수하기</button>
    </div>

    <!-- Success -->
    <div class="success" id="successView">
      <div class="check">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h2>접수 완료</h2>
      <p id="successNo"></p>
      <button class="reset-btn" id="resetBtn">새 접수</button>
    </div>

    <script>
      const formData = {};
      const badge = document.getElementById("badge");
      const submitBtn = document.getElementById("submitBtn");
      const formWrap = document.getElementById("formWrap");
      const bottomBar = document.getElementById("bottomBar");
      const successView = document.getElementById("successView");
      const successNo = document.getElementById("successNo");
      const resetBtn = document.getElementById("resetBtn");

      // Set default datetime
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      const dtStr = now.toISOString().slice(0, 16);
      const dtInput = document.querySelector('[data-key="inboundDate"]');
      if (dtInput) {
        dtInput.value = dtStr;
        formData.inboundDate = dtStr;
      }

      // Input / Select listeners
      document
        .querySelectorAll("input[data-key], select[data-key]")
        .forEach((el) => {
          el.addEventListener("input", () => {
            formData[el.dataset.key] = el.value.trim();
            updateBadge();
          });
          el.addEventListener("change", () => {
            formData[el.dataset.key] = el.value.trim();
            updateBadge();
          });
        });

      // Radio chip listeners
      document.querySelectorAll("[data-radio]").forEach((group) => {
        const key = group.dataset.radio;
        group.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            group
              .querySelectorAll(".chip")
              .forEach((c) => c.classList.remove("on"));
            chip.classList.add("on");
            formData[key] = chip.dataset.val;
            updateBadge();
          });
        });
      });

      function getRequiredKeys() {
        const keys = [];
        document.querySelectorAll("[data-required]").forEach((el) => {
          if (el.dataset.key) keys.push(el.dataset.key);
          if (el.dataset.radio) keys.push(el.dataset.radio);
        });
        return keys;
      }

      function updateBadge() {
        const req = getRequiredKeys();
        const filled = req.filter(
          (k) => formData[k] && formData[k].toString().trim(),
        ).length;
        badge.textContent = `필수 ${filled}/${req.length}`;
        submitBtn.disabled = filled < req.length;
      }

      // Submit
      submitBtn.addEventListener("click", () => {
        formWrap.classList.add("hide");
        bottomBar.style.display = "none";
        successView.classList.add("show");
        successNo.textContent = formData.accidentNo || "번호 미입력";

        // ── 여기서 Google Apps Script로 POST ──
        // fetch("YOUR_APPS_SCRIPT_URL", {
        //   method: "POST",
        //   body: JSON.stringify(formData),
        // });
      });

      // Reset
      resetBtn.addEventListener("click", () => {
        Object.keys(formData).forEach((k) => delete formData[k]);
        document
          .querySelectorAll("input[data-key]")
          .forEach((el) => (el.value = ""));
        document
          .querySelectorAll("select[data-key]")
          .forEach((el) => (el.value = ""));
        document
          .querySelectorAll(".chip.on")
          .forEach((el) => el.classList.remove("on"));
        const dtInput = document.querySelector('[data-key="inboundDate"]');
        const now2 = new Date();
        now2.setMinutes(now2.getMinutes() - now2.getTimezoneOffset());
        dtInput.value = now2.toISOString().slice(0, 16);
        formData.inboundDate = dtInput.value;
        formWrap.classList.remove("hide");
        bottomBar.style.display = "";
        successView.classList.remove("show");
        updateBadge();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      updateBadge();
    </script>
  </body>
</html>
